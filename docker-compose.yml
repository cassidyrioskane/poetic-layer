version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # inject the backend URL so React builds with the right API base
    environment:
      - REACT_APP_API_URL=http://mapping-service:8000
    ports:
      - "3000:80"
    depends_on:
      - mapping-service

  mapping-service:
    build:
      context: .
      dockerfile: services/mapping-service/Dockerfile
    environment:
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
