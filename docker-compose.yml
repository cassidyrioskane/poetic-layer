version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - mapping-service
      - codegen-engine

  mapping-service:
    build:
      context: .
      dockerfile: services/mapping-service/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/mapping-service:/app/services/mapping-service
      - ./packages:/app/packages

  codegen-engine:
    build:
      context: .
      dockerfile: services/codegen-engine/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/codegen-engine:/app/services/codegen-engine
      - ./packages:/app/packages
