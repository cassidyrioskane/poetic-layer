# docker-compose.yml
# Compose spec "version" line removed (deprecated as of Compose v2)
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # The frontend build will bake in this API base at build time
      - REACT_APP_API_URL=http://mapping_service:8000
    ports:
      - "3000:80"
    depends_on:
      - mapping_service

  mapping_service:
    build:
      context: .
      dockerfile: services/mapping_service/Dockerfile
    environment:
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
