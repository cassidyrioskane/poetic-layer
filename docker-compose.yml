services:
  mapping-service:
    build:
      context: .
      dockerfile: services/mapping-service/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./packages:/app/packages
      - ./services/mapping-service:/app/services/mapping-service

  codegen-engine:
    build:
      context: .
      dockerfile: services/codegen-engine/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./packages:/app/packages
      - ./services/codegen-engine:/app/services/codegen-engine

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
    stdin_open: true
    tty: true