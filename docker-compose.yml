services:
  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./packages:/app/packages
      - ./services/registry:/app/services/registry

  omega:
    build:
      context: .
      dockerfile: services/omega/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./packages:/app/packages
      - ./services/omega:/app/services/omega
